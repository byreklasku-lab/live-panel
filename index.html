<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Battle Panel</title>

<style>
body{
    margin:0;
    background:#000;
    font-family:Arial, sans-serif;
    color:white;
}

/* CONTAINER */
.wrapper{
    display:flex;
    padding:20px;
    gap:20px;
}

/* HOST PANEL */
.host{
    width:320px;
    height:520px;
    border:2px solid #00cfff;
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

.host img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.host-badge{
    position:absolute;
    top:10px;
    left:10px;
    background:#f5c84c;
    color:black;
    padding:5px 12px;
    border-radius:20px;
    font-size:14px;
}

.host-name{
    position:absolute;
    bottom:10px;
    left:15px;
    font-size:18px;
}

/* RIGHT SIDE */
.right{
    display:flex;
    flex-direction:column;
}

/* ACTIVE GUEST */
.active{
    width:170px;
    background:#111;
    border-radius:18px;
    padding:15px;
    position:relative;
    margin-bottom:20px;
    text-align:center;
}

.active img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
}

.coins{
    position:absolute;
    top:8px;
    right:8px;
    background:#1f1f1f;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
}

/* REQUEST GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,170px);
    grid-auto-rows:110px;
    gap:15px;
}

.request{
    background:#0d0d0d;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:18px;
    color:#888;
}

.plus{
    font-size:26px;
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- HOST -->
    <div class="host">
        <div class="host-badge">Host</div>
        <img id="hostImg" src="">
        <div class="host-name" id="hostName">Delviago</div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="active">
            <div class="coins" id="coins">0 💎</div>
            <img id="guestImg" src="">
            <div id="guestName">Guest</div>
        </div>

        <div class="grid">
            <div class="request"><div class="plus">+</div>Request</div>
            <div class="request"><div class="plus">+</div>Request</div>
            <div class="request"><div class="plus">+</div>Request</div>
            <div class="request"><div class="plus">+</div>Request</div>
            <div class="request"><div class="plus">+</div>Request</div>
            <div class="request"><div class="plus">+</div>Request</div>
            <div class="request"><div class="plus">+</div>Request</div>
            <div class="request"><div class="plus">+</div>Request</div>
        </div>

    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("hostName").innerText = params.get("host") || "Delviago";
document.getElementById("guestName").innerText = params.get("guest") || "Guest";
document.getElementById("coins").innerText = (params.get("coins") || "0") + " 💎";

document.getElementById("hostImg").src = params.get("hostimg") || "";
document.getElementById("guestImg").src = params.get("guestimg") || "";
</script>

</body>
</html>
