<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Guest Panel</title>

<style>
body{
  margin:0;
  background:#1e1f23;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
}

/* GRID I PANELIT (NUK E NDRYSHOJ) */
.panel{
  display:grid;
  grid-template-columns: repeat(2, 160px);
  gap:20px;
}

/* KUTIA E GUEST */
.guest-card{
  width:160px;
  height:150px;
  background:#000000;
  border-radius:22px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* AVATAR */
.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
}

/* COINS SIPER */
.coins{
  position:absolute;
  top:8px;
  right:8px;
  background:rgb(255, 255, 255);
  border-radius:20px;
  padding:2px 6px;
  display:flex;
  align-items:center;
  font-size:11px;
  font-weight:bold;
}

.coins img{
  width:14px;
  height:14px;
  margin-right:3px;
}

/* EMRI + MIC NE NJE RRESHT */
.username-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:6px;
}

/* KUTIA E EMRIT */
.username-box{
  background:black;
  color:white;
  border-radius:20px;
  padding:3px 10px;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:6px;
}

/* PLUS I VOGEL */
.plus{
  background:#444;
  width:16px;
  height:16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* MIC */
.mic{
  width:14px;
  height:14px;
}

/* KUTI BOSHE */
.empty{
  background:#000000;
  border-radius:22px;
  width:160px;
  height:150px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:14px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="panel">

  <!-- GUEST I PARE -->
  <div class="guest-card">

    <div class="coins">
       <img src="coin.png" class="coin-icon">
       <span>150,000</span>
</div>

    <img src="avatar.png" class="avatar">

    <div class="username-row">
      <div class="username-box">
        <span>VALTER..</span>
        <span class="plus">+</span>
      </div>
      <img src="mic.png" class="mic">
    </div>

  </div>

  <!-- KUTITE TJERA -->
  <div class="empty">+ Invite</div>
  <div class="empty">+ Invite</div>
  <div class="empty">+ Invite</div>
  <div class="empty">+ Invite</div>
  <div class="empty">+ Invite</div>
  <div class="empty">+ Invite</div>
  <div class="empty">+ Invite</div>

</div>

</body>

</html>
